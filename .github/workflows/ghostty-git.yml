name: ghostty-git snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1,4"

permissions:
  contents: write
  issues: write

concurrency:
  group: ghostty-git-snapshot
  cancel-in-progress: false

jobs:
  update:
    name: Update and build ghostty-git
    runs-on: ubuntu-latest
    container: fedora:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Install tooling
        run: |
          dnf -y install --setopt=install_weak_deps=0 --nodocs \
            copr-cli curl findutils gh git jq make patch rpm-build rpmdevtools rpmlint sed zstd

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update ghostty-git snapshot
        id: update
        run: scripts/update-ghostty-git.sh

      - name: Stop when upstream is unchanged
        if: steps.update.outputs.changed != 'true'
        run: echo "No upstream Ghostty main change detected."

      - name: Validate package metadata
        if: steps.update.outputs.changed == 'true'
        run: |
          make check-upstream PACKAGE=ghostty-git
          make check-specs
          make srpm PACKAGE=ghostty-git
          rpmbuild -bp --nodeps \
            --define "_sourcedir $PWD/packages/ghostty-git/sources" \
            --define "_specdir $PWD/packages/ghostty-git" \
            --define "_builddir $PWD/packages/ghostty-git" \
            --define "_srcrpmdir $PWD/dist/srpm" \
            --define "_rpmdir $PWD/packages/ghostty-git" \
            --define "_buildrootdir $PWD/packages/ghostty-git/.build" \
            packages/ghostty-git/ghostty-git.spec
          rm -rf packages/ghostty-git/ghostty-git-*-build
          git diff --check

      - name: Configure COPR credentials
        if: steps.update.outputs.changed == 'true'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [ -z "${COPR_CONFIG:-}" ]; then
            echo "::error::Missing COPR_CONFIG repository secret"
            exit 1
          fi
          mkdir -p "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
          chmod 600 "$HOME/.config/copr"
          copr-cli whoami

      # The snapshot bump is pushed to a throwaway candidate branch, never to
      # the target branch. COPR builds that exact commit, and the target branch
      # is fast-forwarded to it only after every chroot succeeded, so the target
      # branch always points at the last snapshot that built.
      - name: Commit snapshot bump to candidate branch
        if: steps.update.outputs.changed == 'true'
        id: candidate
        env:
          SHORT_COMMIT: ${{ steps.update.outputs.short_commit }}
        run: |
          branch="ghostty-git-candidate/${SHORT_COMMIT}-${GITHUB_RUN_ID}"
          git add packages/ghostty-git/ghostty-git.spec packages/ghostty-git/package.env
          git commit -m "Update ghostty-git snapshot to ${SHORT_COMMIT}"
          git push origin "HEAD:refs/heads/${branch}"
          echo "branch=${branch}" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Trigger COPR build of the candidate commit
        if: steps.update.outputs.changed == 'true'
        id: copr
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          copr-cli buildscm --nowait mineiro/ghostty \
            --clone-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --commit "${CANDIDATE_SHA}" \
            --subdir packages/ghostty-git \
            --spec ghostty-git.spec \
            --method make_srpm | tee /tmp/copr-build.txt
          build_id="$(awk '/Created builds:/ {print $3}' /tmp/copr-build.txt)"
          if [ -z "$build_id" ]; then
            echo "::error::Could not parse COPR build id"
            exit 1
          fi
          echo "build_id=$build_id" >>"$GITHUB_OUTPUT"

      - name: Watch COPR build
        if: steps.update.outputs.changed == 'true'
        env:
          BUILD_ID: ${{ steps.copr.outputs.build_id }}
          SNAPSHOT_VERSION: ${{ steps.update.outputs.version }}
        run: |
          copr-cli watch-build "$BUILD_ID"

          # Require the expected package and success on every chroot, not
          # just a non-failed top-level state.
          build="$(curl -fsS "https://copr.fedorainfracloud.org/api_3/build/${BUILD_ID}")"
          pkg="$(jq -r '.source_package.name' <<<"$build")"
          version="$(jq -r '.source_package.version' <<<"$build")"
          if [ "$pkg" != "ghostty-git" ] || [ "${version%-*}" != "$SNAPSHOT_VERSION" ]; then
            echo "::error::COPR build ${BUILD_ID} built ${pkg} ${version}, expected ghostty-git ${SNAPSHOT_VERSION}"
            exit 1
          fi
          chroots="$(curl -fsS "https://copr.fedorainfracloud.org/api_3/build-chroot/list?build_id=${BUILD_ID}")"
          jq -r '.items[] | "\(.name) \(.state)"' <<<"$chroots"
          if ! jq -e '(.items | length) > 0 and all(.items[]; .state == "succeeded")' <<<"$chroots" >/dev/null; then
            echo "::error::COPR build ${BUILD_ID} did not succeed on every chroot"
            exit 1
          fi

      - name: Publish snapshot bump
        if: steps.update.outputs.changed == 'true'
        env:
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          # Plain push: rejected unless it is a fast-forward, so a target
          # branch that moved during the build is never overwritten. The next
          # run then retries on top of the new tip.
          git push origin "${CANDIDATE_SHA}:refs/heads/${GITHUB_REF_NAME}"
          git push origin --delete "${CANDIDATE_BRANCH}"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_ID: ${{ steps.copr.outputs.build_id }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CHANGED: ${{ steps.update.outputs.changed }}
          SHORT_COMMIT: ${{ steps.update.outputs.short_commit }}
          SNAPSHOT_VERSION: ${{ steps.update.outputs.version }}
        run: |
          title="ghostty-git automation failed"
          body="$(mktemp)"
          {
            echo "The scheduled ghostty-git automation failed."
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Changed: ${CHANGED:-unknown}"
            echo "- Upstream commit: ${SHORT_COMMIT:-unknown}"
            echo "- Snapshot version: ${SNAPSHOT_VERSION:-unknown}"
            if [ -n "${BUILD_ID:-}" ]; then
              echo "- COPR build: https://copr.fedorainfracloud.org/coprs/build/${BUILD_ID}"
            fi
            if [ -n "${CANDIDATE_SHA:-}" ]; then
              echo "- Candidate: ${CANDIDATE_SHA} on branch ${CANDIDATE_BRANCH}"
              tip="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}' || true)"
              if [ "$tip" = "$CANDIDATE_SHA" ]; then
                echo "- ${GITHUB_REF_NAME} was already fast-forwarded to the candidate"
              else
                echo "- ${GITHUB_REF_NAME} was not updated (tip: ${tip:-unknown})"
              fi
            fi
          } >"$body"

          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body" || true
          else
            gh issue create --title "$title" --body-file "$body" || true
          fi
